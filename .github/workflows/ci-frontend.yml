name: CI Frontend

# Só roda quando algo do frontend (ou o próprio workflow) muda
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    name: Biome, Vitest, Build e Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Verifica o lint
        run: npm run lint

      - name: Verifica a formatação
        run: npm run format:check

      - name: Executa os testes unitários e de integração
        run: npm run test

      - name: Gera o build
        run: npm run build

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executa os testes E2E
        run: npm run test:e2e

      # Se o E2E quebrar, o relatório (com o trace do retry) fica disponível pra baixar no run
      - name: Envia o relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
